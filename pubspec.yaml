name: dart_dependency_checker_cli
description: A command-line utility for checking and fixing dependencies within Dart/Flutter packages.
repository: https://github.com/akaiser/dart_dependency_checker_cli
version: 1.1.0

executables:
  dart_dependency_checker:
  ddc:

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  dart_dependency_checker: ^1.1.0
  equatable: ^2.1.0
  yaansi: ^1.2.0

dev_dependencies:
  build_runner: ^2.15.2
  build_version: ^2.1.3
  lints: ^6.1.0
  test: ^1.31.2
  yaml: ^3.1.3
